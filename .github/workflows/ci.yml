name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (MercatoServer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore MercatoServer/MercatoServer.slnx

      - name: Build
        run: dotnet build MercatoServer/MercatoServer.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test MercatoServer/MercatoServer.slnx --no-build --configuration Release

  frontend:
    name: Frontend (MercatoClient)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MercatoClient
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: MercatoClient/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
